<line x1="1190" y1="265" x2="1246" y2="265" stroke="#d24e42" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#ar)"/>
<text x="1000" y="420" font-size="14" fill="#5b6b7c">views the quad</text>
<text x="40" y="600" font-size="15" fill="#5b6b7c">Screenshot in godot/screenshots is upstream's, not a Walker capture (R-04). Pong reads only its own viewport rect (pong.gd:18); it does not know it is in 3D.</text>
