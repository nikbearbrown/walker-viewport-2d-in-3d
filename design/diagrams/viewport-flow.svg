<rect x="970" y="200" width="220" height="130" rx="10"/>
<rect x="660" y="420" width="240" height="110" rx="10"/>
</g>
<rect x="1250" y="200" width="210" height="130" rx="10" fill="#fffdf7" stroke="#d24e42" stroke-width="2.5" stroke-dasharray="10 7"/>
<g font-size="20" font-weight="700" text-anchor="middle">
<text x="150" y="240">Keys W S Up Down</text>
<text x="460" y="240">Pong (Node2D)</text>
<text x="780" y="240">ViewportTexture</text>
<text x="1080" y="240">ViewportQuad</text>
<text x="780" y="460">Camera3D idle</text>
<text x="1355" y="240">Pixels on screen</text>
</g>
<g font-size="14" text-anchor="middle" fill="#25354a">
<text x="150" y="268">4 actions, physical keys</text>
<text x="150" y="290">project.godot:24-45</text>
<text x="150" y="312">S-03 · F-03</text>
<text x="460" y="268">inside SubViewport 600x400</text>
<text x="460" y="290">update mode 4 · tscn:76-81</text>
<text x="460" y="312">pong.gd:22-70 · F-01</text>
<text x="780" y="268">viewport.get_texture()</text>
<text x="780" y="290">bound once in _ready</text>
<text x="780" y="312">2d_in_3d.gd:11-15 · F-02</text>
<text x="1080" y="268">PlaneMesh, albedo_texture</text>
<text x="1080" y="290">3:2 scale · tscn:71-74</text>
<text x="1080" y="312">identity checked by T-01</text>
<text x="780" y="488">sin/cos sway, 0.005 rad</text>
<text x="780" y="510">2d_in_3d.gd:18-23 · F-07</text>
<text x="1355" y="268">never captured</text>
<text x="1355" y="290">VERIFICATION.md:23-25</text>
<text x="1355" y="312">T-04 proposed · R-01</text>
</g>
