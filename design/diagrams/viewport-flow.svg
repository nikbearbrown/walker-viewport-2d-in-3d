<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="t d">
<title id="t">Input to viewport to 3D flow, recovered from godot/2d_in_3d.gd and godot/pong.gd</title>
<desc id="d">Keys drive Pong inside a 600x400 SubViewport; its ViewportTexture is bound to the quad material once at _ready; the camera sways; pixels on screen are unverified. References F-01, F-02, F-03, F-07, S-01, S-03, T-01, T-04, R-01.</desc>
<rect width="1500" height="640" fill="#faf9f5"/>
<defs>
<marker id="ai" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#287c68"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d24e42"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="40" y="50" font-size="30" font-weight="700">Input → SubViewport → quad → screen · S-01</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">solid teal = observed in code · dashed red = proposed / unverified · headless tests (T-01) verified the solid links up to the quad material, not the pixels</text>
<g stroke="#287c68" stroke-width="2.5" fill="#fffdf7">
<rect x="40" y="200" width="220" height="130" rx="10"/>
<rect x="330" y="200" width="260" height="130" rx="10"/>
